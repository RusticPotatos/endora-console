name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Server and contract tests
        run: npm test
      - name: The screens, their requests against the Core contract
        run: node scripts/check-console.mjs
      - name: Nothing of Core's source, nothing of HQ's
        run: node scripts/check-independence.mjs
      - name: Nothing personal, in the tree and the whole history
        run: node scripts/check-nothing-personal.mjs --history
      # Console's own files. The screens copied from Endora stay byte for byte as they are there
      # (SOURCE.md), trailing blank lines included.
      - name: Whitespace
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD -- . ':!web/js' web/js/48-console.js

  # Built and smoke-tested on every change; on main and on a tag also pushed to the public
  # GitHub Container Registry with the workflow's own token.
  image:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rusticpotatos/endora-console
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=endora-console
            org.opencontainers.image.description=Endora Console, the screens for Endora Core
            org.opencontainers.image.licenses=Apache-2.0
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: local/endora-console:test
          build-args: CONSOLE_BUILD=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: sh scripts/smoke.sh local/endora-console:test
      - name: Sign in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: CONSOLE_BUILD=${{ github.sha }}
          cache-from: type=gha
